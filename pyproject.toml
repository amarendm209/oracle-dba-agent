[project]
name = "oracle-dba-agent"
version = "0.1.0"
description = "AI DBA agent: FastMCP Oracle diagnostic tools plus a real-time diagnosis web dashboard"
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=3.0",
    "oracledb>=3.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.6"]

[project.scripts]
dba-mcp = "oracle_dba_agent.mcp_server:main"
dba-web = "oracle_dba_agent.web.app:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"oracle_dba_agent.web" = ["static/*"]

[tool.ruff]
line-length = 110
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
